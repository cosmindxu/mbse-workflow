  <text x="502" y="408" fill="#94a9ac" font-size="14">4.8 of 12 aloft on average: at most 0.40</text>
  <rect x="846" y="108" width="294" height="322" rx="11" fill="#16211f" stroke="#2b3c3e"/>
  <text x="866" y="142" fill="#94a9ac" font-size="14" letter-spacing="1.3">AREA UNDER WATCH</text>
  <text x="866" y="190" fill="#94a9ac" font-size="15">the architecture claimed</text>
  <text x="866" y="232" fill="#e9f1f1" font-size="40" font-weight="680">0.92</text>
  <text x="866" y="278" fill="#94a9ac" font-size="15">one sector per drone: at most</text>
  <text x="866" y="320" fill="#f87171" font-size="40" font-weight="680">0.40</text>
  <line x1="866" y1="342" x2="1120" y2="342" stroke="#2b3c3e"/>
  <text x="866" y="366" fill="#e9f1f1" font-size="15" font-weight="620">Every gate passed it</text>
  <text x="866" y="388" fill="#94a9ac" font-size="15">Simulating the model exposed it.</text>
  <text x="866" y="408" fill="#94a9ac" font-size="15">A gate now stops it.</text>
  <text x="40" y="472" fill="#94a9ac" font-size="15">A SysML-like model &#183; every layer checked by Sysprose &#183; the physical layer flown in Gazebo with ArduPilot autopilots</text>
