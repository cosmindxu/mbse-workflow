  <text x="388" y="424" fill="#94a9ac" font-size="15" text-anchor="middle">every step gated</text>
  <rect x="482" y="108" width="330" height="322" rx="11" fill="#16211f" stroke="#2b3c3e"/>
  <text x="502" y="142" fill="#94a9ac" font-size="14" letter-spacing="1.3">WHAT THE DUTY CYCLE ALLOWS</text>
