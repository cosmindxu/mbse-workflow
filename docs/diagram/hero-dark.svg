<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 492" width="1180" height="492" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1180" height="492" rx="14" fill="#0e1918"/>
  <text x="40" y="52" fill="#e9f1f1" font-size="25" font-weight="650">Every layer gated, then flown to find out</text>
  <text x="40" y="80" fill="#94a9ac" font-size="15">Twelve drones over 25 km&#178;, authored layer by layer in a SysML-like dialect, gated at every step &#8212; and one estimate nobody had computed.</text>
  <rect x="40" y="108" width="268" height="322" rx="11" fill="#16211f" stroke="#2b3c3e"/>
  <text x="60" y="142" fill="#94a9ac" font-size="14" letter-spacing="1.3">THE BRIEF SETS</text>
  <text x="60" y="184" fill="#e9f1f1" font-size="19" font-weight="620">12</text>
  <text x="60" y="203" fill="#94a9ac" font-size="15">drones it can field</text>
  <text x="60" y="244" fill="#e9f1f1" font-size="19" font-weight="620">25 km²</text>
  <text x="60" y="263" fill="#94a9ac" font-size="15">area to keep watched</text>
  <text x="60" y="304" fill="#e9f1f1" font-size="19" font-weight="620">40 / 60 min</text>
  <text x="60" y="323" fill="#94a9ac" font-size="15">flight, then recharge</text>
  <text x="60" y="364" fill="#e9f1f1" font-size="19" font-weight="620">≥ 0.9</text>
  <text x="60" y="383" fill="#94a9ac" font-size="15">of the area, at any moment</text>
  <text x="342" y="142" fill="#94a9ac" font-size="14" letter-spacing="1.3">AUTHORED</text>
